<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">Fala Calourada</div>
</header>

<main class="secao-ativa">

  <div class="modal" style="margin:auto; margin-top:60px; max-width:400px;">

    <h2>Entrar</h2>
    <p class="modal-aviso">Acesse sua conta</p>

    <form id="formLogin">

      <div class="campo">
        <label>Email ou usuário</label>
        <input type="text" name="login" required>
      </div>

      <div class="campo">
        <label>Senha</label>
        <input type="password" name="senha" required>
      </div>

      <button type="submit" class="btn-submit">Entrar</button>

    </form>

    <div id="erroLogin" hidden style="color:red; margin-top:10px;"></div>

  </div>

</main>

<script src="login.js"></script>

</body>
</html>
